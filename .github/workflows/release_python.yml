name: Release Python

on:
  workflow_dispatch:
  push:
    tags:
      - "python-v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  MATURIN_VERSION: v1.14.1
  UV_VERSION: 0.12.1
  UV_EXCLUDE_NEWER: 5 days
  PIP_VERSION: 26.1.2
  PACKAGING_VERSION: 26.2
  TWINE_VERSION: 6.2.0
  ABI3AUDIT_VERSION: 0.0.26
  BUILD_ARGS: --profile dist-release --locked --out dist --compatibility pypi

jobs:
  sdist:
    name: sdist
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist
          working-directory: rustuna_pyo3
      - name: Show sdist contents
        # rustuna_pyo3 is a workspace member with path dependencies, so make sure the sibling
        # crates and the workspace manifest actually made it into the archive.
        run: tar tzf rustuna_pyo3/dist/*.tar.gz
      - name: Test sdist
        # The ubuntu runner image ships a Rust toolchain, so this compiles the extension from
        # source exactly like a user without a matching wheel would.
        run: |
          set -euxo pipefail
          uv run --isolated --no-project --with rustuna_pyo3/dist/*.tar.gz \
            python -I "$GITHUB_WORKSPACE/rustuna_pyo3/tests/wheel_smoke_test.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: rustuna_pyo3/dist
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  linux:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The manylinux images ship every CPython in /opt/python/<python tag>-<abi tag>, so the
      # interpreters are addressed by absolute path instead of relying on the host.
      - name: Build wheel (cp311-abi3)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          working-directory: rustuna_pyo3
          args: ${{ env.BUILD_ARGS }} --interpreter /opt/python/cp311-cp311/bin/python

      - name: Build wheel (cp315-abi3t)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          working-directory: rustuna_pyo3
          args: ${{ env.BUILD_ARGS }} --interpreter /opt/python/cp315-cp315t/bin/python

      - name: Set up Python for the wheel tests
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: |
            3.11
            3.12
            3.13
            3.14
            3.15
            3.15t
          allow-prereleases: true

      - name: Test GIL-enabled wheels
        run: |
          set -euxo pipefail
          for py in python3.11 python3.12 python3.13 python3.14 python3.15; do
            "$py" -m pip install --force-reinstall --no-deps --no-index \
              --find-links "$PWD/rustuna_pyo3/dist" rustuna
            "$py" -I "$GITHUB_WORKSPACE/rustuna_pyo3/tests/wheel_smoke_test.py"
          done

      - name: Test free-threaded wheel without the GIL
        run: |
          set -euxo pipefail
          python3.15t -m pip install --upgrade "pip==$PIP_VERSION" "packaging==$PACKAGING_VERSION"
          python3.15t -m pip install --force-reinstall --no-deps --no-index \
            --find-links "$PWD/rustuna_pyo3/dist" rustuna
          PYTHON_GIL=0 RUSTUNA_EXPECT_FREE_THREADED=1 \
            python3.15t -I "$GITHUB_WORKSPACE/rustuna_pyo3/tests/wheel_smoke_test.py"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.target }}
          path: rustuna_pyo3/dist
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  macos-windows:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Unlike the Linux jobs there is no container full of interpreters here, and Windows has no
      # `python3.X` executables, so each interpreter is installed right before the build that needs
      # it and passed to maturin as plain `python`.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build wheel (cp311-abi3)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          working-directory: rustuna_pyo3
          args: ${{ env.BUILD_ARGS }} --interpreter python
      - name: Test wheel (cp311-abi3)
        run: |
          set -euxo pipefail
          python -m pip install --force-reinstall --no-deps --no-index \
            --find-links "$PWD/rustuna_pyo3/dist" rustuna
          python -I "$GITHUB_WORKSPACE/rustuna_pyo3/tests/wheel_smoke_test.py"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15t"
          allow-prereleases: true
      - name: Build wheel (cp315-abi3t)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          working-directory: rustuna_pyo3
          args: ${{ env.BUILD_ARGS }} --interpreter python
      - name: Test wheel (cp315-abi3t)
        run: |
          set -euxo pipefail
          python -m pip install --upgrade "pip==$PIP_VERSION" "packaging==$PACKAGING_VERSION"
          python -m pip install --force-reinstall --no-deps --no-index \
            --find-links "$PWD/rustuna_pyo3/dist" rustuna
          PYTHON_GIL=0 RUSTUNA_EXPECT_FREE_THREADED=1 \
            python -I "$GITHUB_WORKSPACE/rustuna_pyo3/tests/wheel_smoke_test.py"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.target }}
          path: rustuna_pyo3/dist
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  check-version:
    name: Check version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the tag with the workspace version
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "python-v${version}" != "$GITHUB_REF_NAME" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match the workspace version ${version}" >&2
            exit 1
          fi

  verify:
    name: Verify distributions
    needs: [sdist, linux, macos-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Check metadata
        run: |
          set -euxo pipefail
          uvx --from "twine==$TWINE_VERSION" twine check dist/*
          # Verify that the stable ABI wheels really only use the limited API.
          # abi3audit does not know the `abi3t` tag yet, so only the cp311-abi3 wheels are checked.
          uvx --from "abi3audit==$ABI3AUDIT_VERSION" \
            abi3audit --strict --verbose dist/*cp311-abi3-*.whl
      - name: Upload verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: [verify, check-version]
    if: >-
      ${{
        github.repository == 'optuna/rustuna' &&
        github.event_name == 'push' &&
        github.ref_type == 'tag' &&
        startsWith(github.ref, 'refs/tags/python-v')
      }}
    runs-on: ubuntu-24.04
    environment:
      name: release-python
      url: https://pypi.org/project/rustuna
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # See https://github.com/pypa/gh-action-pypi-publish/issues/283
          attestations: false
          verbose: true
