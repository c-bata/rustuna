name: Checks and tests (Rust)
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
jobs:
  rust_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - run: cargo clippy --workspace --lib --bins --tests --examples --all-features -- -D warnings
      - name: Rustfmt Check
        uses: actions-rust-lang/rustfmt@v1
  rust_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - run: cargo test --all-features

      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Install
        run: |
          python -m pip install -U pip
          pip install --progress-bar off optuna
      - name: Run tests which require Python and Optuna
        working-directory: rustuna_storage
        run: |
          cargo test -- --ignored
