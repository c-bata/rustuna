name: Checks and tests (Python)
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
jobs:
  python_lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: Install dependencies
        working-directory: rustuna_pyo3
        run: uv sync --group dev
      - name: ruff
        working-directory: rustuna_pyo3
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: mypy
        working-directory: rustuna_pyo3
        run: uv run mypy rustuna/ python_examples/ tests/
  python_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python packages
        working-directory: rustuna_pyo3
        run: |
          uv sync --group dev
      - name: Run tests
        working-directory: rustuna_pyo3
        run: uv run --no-sync pytest tests/
